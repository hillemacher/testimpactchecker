plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '7.2.1'
}

group = 'io.github.hillemacher'
version = rootProject.version

base {
    archivesName = 'testimpactchecker-gradle-plugin'
}

afterEvaluate {
    publishing.publications.withType(MavenPublication).configureEach { pub ->
        // The plugin marker publication is name-sensitive; only rewrite the main jar publication.
        if (pub.name == 'pluginMaven') {
            pub.artifactId = 'testimpactchecker-gradle-plugin'
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

checkstyle {
    toolVersion = '10.21.3'
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        googleJavaFormat('1.27.0')
        formatAnnotations()
        importOrder()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

tasks.named('processIntegrationTestResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation rootProject
    implementation("com.fasterxml.jackson.core:jackson-databind:2.19.1")

    compileOnly("org.projectlombok:lombok:1.18.38")
    annotationProcessor("org.projectlombok:lombok:1.18.38")

    testImplementation platform("org.junit:junit-bom:5.10.0")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    testImplementation("org.assertj:assertj-core:3.27.3")

    integrationTestImplementation gradleTestKit()
}

gradlePlugin {
    plugins {
        testImpactChecker {
            id = 'io.github.hillemacher.testimpactchecker'
            displayName = 'Test Impact Checker'
            description = 'Runs only the JUnit tests impacted by the current Git diff.'
            implementationClass = 'io.github.hillemacher.testimpactchecker.gradle.TestImpactCheckerPlugin'
        }
    }

    testSourceSets(sourceSets.integrationTest)
}

tasks.register('integrationTest', Test) {
    description = 'Runs the Gradle TestKit integration suite.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
    inputs.dir('src/integrationTest/resources')
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = false
        html.required = true
    }
}

test {
    useJUnitPlatform()
}
